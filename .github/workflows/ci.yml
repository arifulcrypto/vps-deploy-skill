name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint
      run: ruff check scripts tests

    - name: Skill entry points resolve
      run: |
        test -f SKILL.md
        test -f .agents/skills/vps-deployer/SKILL.md

    - name: Run Pytest Test Suite (includes bash -n on every generated remote script)
      run: pytest -v

  client-config:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
      with:
        python-version: "3.12"
    - run: pip install -r requirements.txt
    - name: Install Mihomo
      run: |
        curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
        gunzip mihomo.gz && chmod +x mihomo
      env:
        MIHOMO_VERSION: v1.19.33
    - name: Real Mihomo loads every node mix
      run: python tests/e2e/check_yaml.py
      env:
        MIHOMO: ./mihomo
